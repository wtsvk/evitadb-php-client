name: Auto-update EvitaDB version

on:
  schedule:
    # Daily 06:00 UTC — checks for new evitadb/evitadb tags
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get latest stable EvitaDB version
        id: latest
        run: |
          VERSION=$(curl -sL "https://hub.docker.com/v2/repositories/evitadb/evitadb/tags?page_size=50" \
            | jq -r '[.results[] | select(.name | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))] | .[0].name')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest: $VERSION"

      - name: Get current package EvitaDB version
        id: current
        run: |
          CURRENT=$(jq -r '.extra["evitadb-version"]' composer.json)
          echo "version=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current: $CURRENT"

      - name: Skip if up to date
        if: steps.latest.outputs.version == steps.current.outputs.version
        run: |
          echo "Already on latest: ${{ steps.current.outputs.version }}"
          exit 0

      - name: Check if PR already open
        id: pr_check
        if: steps.latest.outputs.version != steps.current.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto-update/evitadb-${{ steps.latest.outputs.version }}"
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[].number' | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update composer.json metadata
        if: steps.latest.outputs.version != steps.current.outputs.version && steps.pr_check.outputs.exists == 'false'
        run: |
          jq --indent 4 ".extra[\"evitadb-version\"] = \"${{ steps.latest.outputs.version }}\"" composer.json > /tmp/cj
          mv /tmp/cj composer.json

      - name: Update README compatibility table
        if: steps.latest.outputs.version != steps.current.outputs.version && steps.pr_check.outputs.exists == 'false'
        env:
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          LAST_TAG=${LAST_TAG:-v0.0.0}
          IFS='.' read -r MAJOR MINOR _ <<< "${LAST_TAG#v}"
          NEW_MINOR=$((MINOR + 1))
          NEW_PKG="${MAJOR}.${NEW_MINOR}.x"
          NEW_ROW="| ${NEW_PKG}   | ${LATEST} |"

          awk -v row="$NEW_ROW" '
            /^\|[-]+\|[-]+\|$/ && !inserted {
              print
              print row
              inserted = 1
              next
            }
            { print }
          ' README.md > /tmp/readme && mv /tmp/readme README.md

      - name: Sync proto files from EvitaDB image
        if: steps.latest.outputs.version != steps.current.outputs.version && steps.pr_check.outputs.exists == 'false'
        # Runs on the host — ubuntu-latest already ships docker, jq and unzip.
        run: bash scripts/sync-protos.sh

      - name: Regenerate PHP stubs
        if: steps.latest.outputs.version != steps.current.outputs.version && steps.pr_check.outputs.exists == 'false'
        # Run only the protoc step INSIDE namely/protoc-all so we get a known-good
        # protoc + grpc_php_plugin without copying ELF binaries onto the host (which is
        # fragile across glibc versions). Do NOT apt-get anything in this image: it is
        # Debian 11 (bullseye), EOL — its security pool returns 404 and apt exits 100.
        # Files written inside the container are root-owned; chown them back to the
        # runner uid before the next step.
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            --entrypoint bash \
            namely/protoc-all:1.51_2 -c '
              set -e
              bash scripts/build-proto.sh
              chown -R "$HOST_UID:$HOST_GID" src/Protocol/
            '

      - name: Check for proto/stub changes
        id: changes
        if: steps.latest.outputs.version != steps.current.outputs.version && steps.pr_check.outputs.exists == 'false'
        # composer.json and README.md are always touched by the earlier steps — only
        # regenerated protos/stubs make the new EvitaDB version worth a PR. Without a
        # gRPC API change the current package works with the new server as-is.
        run: |
          if git status --porcelain proto/ src/Protocol/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No proto/stub changes for ${{ steps.latest.outputs.version }} — skipping PR."
          fi

      - name: Open PR
        if: steps.latest.outputs.version != steps.current.outputs.version && steps.pr_check.outputs.exists == 'false' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto-update/evitadb-${{ steps.latest.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Bump EvitaDB to ${{ steps.latest.outputs.version }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Bump EvitaDB to ${{ steps.latest.outputs.version }}" \
            --body "Automated PR — protos and stubs regenerated for EvitaDB **${{ steps.latest.outputs.version }}** (was ${{ steps.current.outputs.version }}). Review the diff, verify CI passes, then merge." \
            --base main \
            --head "$BRANCH"

      - name: Close superseded auto-update PRs
        if: steps.latest.outputs.version != steps.current.outputs.version && steps.pr_check.outputs.exists == 'false' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: auto-update/evitadb-${{ steps.latest.outputs.version }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"auto-update/evitadb-\")) | select(.headRefName != \"$BRANCH\") | .number" \
            | while read -r PR; do
                gh pr close "$PR" --delete-branch --comment "Superseded by the auto-update PR for EvitaDB $LATEST."
              done
